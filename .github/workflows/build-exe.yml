name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        id: build
        run: |
          $tag = git rev-parse --short HEAD
          $name = "LCA-$tag"
          pyinstaller --onefile `
            --name $name `
            --add-data "resources;resources" `
            --add-data "images;images" `
            --add-data "themes;themes" `
            --add-data "plugins;plugins" `
            --add-data "OLA;OLA" `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=cv2 `
            --hidden-import=numpy `
            --hidden-import=PIL `
            --hidden-import=psutil `
            --hidden-import=keyboard `
            --hidden-import=mouse `
            --hidden-import=mss `
            --hidden-import=dxcam `
            --hidden-import=appium `
            --hidden-import=openai `
            --hidden-import=onnxruntime `
            --hidden-import=cryptography `
            --hidden-import=comtypes `
            main.py
          Write-Output "exe_name=$name.exe" >> $env:GITHUB_OUTPUT
          Write-Output "exe_path=dist\$name.exe" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCA-EXE
          path: dist/${{ steps.build.outputs.exe_name }}

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: LCA Build ${{ github.run_number }}
          body: |
            自动构建的 Windows 可执行文件
            
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 入口: main.py
            - 打包工具: PyInstaller --onefile
          files: ${{ steps.build.outputs.exe_path }}
          draft: false
          prerelease: false
