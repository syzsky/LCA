name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        id: build
        shell: pwsh
        run: |
          $tag = git rev-parse --short HEAD
          $name = "LCA-$tag"
          
          # 构建 add-data 参数，只添加存在的目录
          $addDataArgs = @()
          @("resources", "images", "themes", "plugins", "OLA") | ForEach-Object {
            if (Test-Path $_) {
              $addDataArgs += "--add-data"
              $addDataArgs += "$_;$_"
            }
          }
          
          Write-Host "Add-data args: $($addDataArgs -join ' ')"
          
          # 构建 exclude-module 参数
          $excludeArgs = @()
          @(
            "dxcam", "fastdeploy-python", "fastdeploy-tools",
            "winsdk", "winrt-runtime",
            "winrt-Windows.AI.MachineLearning", "winrt-Windows.Foundation",
            "winrt-Windows.Graphics", "winrt-Windows.Graphics.Capture",
            "winrt-Windows.Graphics.Capture.Interop", "winrt-Windows.Graphics.DirectX",
            "winrt-Windows.Graphics.DirectX.Direct3D11", "winrt-Windows.Graphics.Imaging",
            "uiautomation", "WMI",
            "selenium", "Appium-Python-Client",
            "trio", "trio-websocket", "websocket-client", "wsproto",
            "uvicorn", "pynput",
            "PyAutoGUI", "PyGetWindow", "PyMsgBox", "PyRect", "PyScreeze", "PyDirectInput",
            "pyperclip", "pyreadline3", "pysocks", "pytweening",
            "sortedcontainers", "altgraph", "decorator", "distro",
            "flatbuffers", "humanfriendly", "jiter", "mpmath", "sympy", "zstandard"
          ) | ForEach-Object {
            $excludeArgs += "--exclude-module"
            $excludeArgs += $_
          }
          
          # 执行打包
          pyinstaller --onefile --name $name @addDataArgs @excludeArgs `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=cv2 `
            --hidden-import=numpy `
            --hidden-import=PIL `
            --hidden-import=psutil `
            --hidden-import=keyboard `
            --hidden-import=mouse `
            --hidden-import=mss `
            --hidden-import=appium `
            --hidden-import=openai `
            --hidden-import=onnxruntime `
            --hidden-import=cryptography `
            --hidden-import=comtypes `
            main.py
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ PyInstaller failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          $exePath = "dist\$name.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length
            Write-Host "✅ Build success: $exePath ($size bytes)"
            Write-Output "exe_name=$name.exe" >> $env:GITHUB_OUTPUT
            Write-Output "exe_path=$exePath" >> $env:GITHUB_OUTPUT
            Write-Output "BUILD_SUCCESS=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ EXE file not found"
            Write-Output "BUILD_SUCCESS=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

      - name: Upload artifact
        if: steps.build.outputs.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LCA-EXE
          path: dist/${{ steps.build.outputs.exe_name }}

      - name: Create Release
        if: steps.build.outputs.BUILD_SUCCESS == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: LCA Build ${{ github.run_number }}
          body: |
            自动构建的 Windows 可执行文件
            
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 入口: main.py
            - 打包工具: PyInstaller --onefile
          files: ${{ steps.build.outputs.exe_path }}
          draft: false
          prerelease: false
