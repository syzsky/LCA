name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $tag = git rev-parse --short HEAD
          $name = "LCA-$tag"
          
          $addDataArgs = @()
          @("resources", "images", "themes", "plugins", "workflows") | ForEach-Object {
            if (Test-Path $_) {
              $addDataArgs += "--add-data"
              $addDataArgs += "$_;$_"
            }
          }
          
          $excludeArgs = @()
          @(
            "dxcam", "fastdeploy-python", "fastdeploy-tools",
            "winsdk", "winrt-runtime",
            "winrt-Windows.AI.MachineLearning", "winrt-Windows.Foundation",
            "winrt-Windows.Graphics", "winrt-Windows.Graphics.Capture",
            "winrt-Windows.Graphics.Capture.Interop", "winrt-Windows.Graphics.DirectX",
            "winrt-Windows.Graphics.DirectX.Direct3D11", "winrt-Windows.Graphics.Imaging",
            "uiautomation", "WMI",
            "selenium", "Appium-Python-Client",
            "trio", "trio-websocket", "websocket-client", "wsproto",
            "uvicorn", "pynput",
            "PyAutoGUI", "PyGetWindow", "PyMsgBox", "PyRect", "PyScreeze", "PyDirectInput",
            "pyperclip", "pyreadline3", "pysocks", "pytweening",
            "sortedcontainers", "altgraph", "decorator", "distro",
            "flatbuffers", "humanfriendly", "jiter", "mpmath", "sympy", "zstandard",
            "OLA", "OLAPlugServer", "OLAPlugDLLHelper", "OLAPlugCOMLoader",
            "plugins.adapters.ola", "plugins.adapters.ola.adapter",
            "plugins.adapters.ola.auth", "plugins.adapters.ola.runtime_config",
            "plugins.adapters.ola.multi_instance_manager"
          ) | ForEach-Object {
            $excludeArgs += "--exclude-module"
            $excludeArgs += $_
          }
          
          pyinstaller --onefile --name $name @addDataArgs @excludeArgs `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=cv2 `
            --hidden-import=numpy `
            --hidden-import=PIL `
            --hidden-import=psutil `
            --hidden-import=keyboard `
            --hidden-import=mouse `
            --hidden-import=mss `
            --hidden-import=appium `
            --hidden-import=openai `
            --hidden-import=onnxruntime `
            --hidden-import=cryptography `
            --hidden-import=comtypes `
            --hidden-import=tzdata `
            main.py
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ PyInstaller failed"
            exit 1
          }
          
          $exePath = "dist\$name.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length
            Write-Host "✅ Build success: $exePath ($([math]::Round($size/1MB, 1))MB)"
          } else {
            Write-Host "❌ EXE file not found"
            Get-ChildItem dist/ -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      - name: Generate release tag
        id: tag
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag_name=v1.0.0-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: LCA ${{ steps.tag.outputs.tag_name }}
          body: |
            LCA 自动化框架 ${{ steps.tag.outputs.tag_name }}
            
            ## 包含内容
            - 多窗口挂机
            - 角色标签检测（战士/法师/道士）
            - 地图选择器
            - 图像识别（模板匹配/OCR）
            - 工作流引擎
            - 录制回放
            - 示例工作流文件（workflows/ 目录）
            
            ## 使用方法
            1. 下载 EXE 并运行
            2. 工作流 → 从文件导入 → 选择 workflows/ 目录下的 .module.json
            3. 绑定游戏窗口 → 运行
          files: dist/*.exe
          draft: false
          prerelease: false
