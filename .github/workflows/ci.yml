name: CI

on:
  push:
    branches: [ main, debug, 'release/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Windows上做完整检查和构建
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python语法检查
        run: |
          python -m py_compile main.py
          echo "✅ 主程序语法检查通过"

      - name: 核心模块导入检查
        run: |
          python -c "
          import sys
          modules = [
              'PySide6',
              'opencv_python',
              'PIL',
              'numpy',
              'psutil',
              'keyboard',
              'mouse',
              'lxml',
          ]
          for m in modules:
              try:
                  __import__(m)
                  print(f'✅ {m} 导入成功')
              except Exception as e:
                  print(f'❌ {m} 导入失败: {e}')
          print('模块检查完成')
          "

      - name: 基础文件完整性检查
        run: |
          python -c "
          import os
          required = [
              'main.py',
              'requirements.txt',
              'ui/',
              'utils/',
              'services/',
              'themes/',
              'resources/',
          ]
          for path in required:
              exists = os.path.exists(path)
              print(f'{\"✅\" if exists else \"❌\"} {path}')
          print('完整性检查完成')
          "