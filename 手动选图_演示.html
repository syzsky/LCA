<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手动选图 - 下拉菜单演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { width: 750px; background: #1e293b; border-radius: 16px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  h1 { color: #f1f5f9; font-size: 20px; text-align: center; }
  .sub { color: #64748b; font-size: 12px; text-align: center; margin: 4px 0 20px; }

  .lca-win { background: #0f172a; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
  .titlebar { background: #1e293b; padding: 8px 14px; display: flex; align-items: center; border-bottom: 1px solid #334155; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .r { background: #ef4444; }
  .y { background: #eab308; }
  .g { background: #22c55e; }
  .win-title { color: #94a3b8; font-size: 12px; margin-left: 12px; }

  .content { padding: 20px; display: flex; flex-direction: column; gap: 12px; }

  .card-row { display: flex; align-items: center; gap: 10px; }
  .card {
    background: #0f172a; border: 1px solid #334155; border-radius: 6px;
    padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex: 1;
  }
  .card .icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .card .name { color: #e2e8f0; font-size: 12px; font-weight: 600; }
  .arrow { color: #475569; font-size: 18px; padding: 0 4px; }
  .card-start .icon { background: #3b82f633; color: #3b82f6; }
  .card-image .icon { background: #22c55e33; color: #22c55e; }

  .card-select {
    border: 2px solid #eab308;
    background: #0f172a;
  }
  .card-select .icon { background: #eab30833; color: #eab308; }
  .card-select .name { color: #eab308; }
  .card-select .badge {
    background: #eab30822; color: #eab308;
    font-size: 9px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid #eab30844;
  }

  .dropdown {
    margin-top: 8px;
    margin-left: 42px;
    width: 280px;
    background: #1e293b;
    border: 1px solid #3b82f6;
    border-radius: 6px;
    overflow: hidden;
  }
  .dropdown .header {
    padding: 8px 12px;
    background: #3b82f622;
    color: #93c5fd;
    font-size: 11px;
    font-weight: 600;
    border-bottom: 1px solid #3b82f644;
  }
  .dropdown .item {
    padding: 8px 12px;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 1px solid #334155;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dropdown .item:hover { background: #3b82f622; color: #e2e8f0; }
  .dropdown .item.selected { background: #22c55e33; color: #22c55e; }
  .dropdown .item .emoji { font-size: 14px; }
  .dropdown .item .detail { color: #64748b; font-size: 10px; margin-left: auto; }
  .dropdown .item .check { margin-left: auto; color: #22c55e; }

  .flow-log { margin-top: 16px; padding: 12px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
  .fl { display: flex; gap: 8px; padding: 4px 0; font-size: 11px; color: #64748b; }
  .fl .n { width: 18px; height: 18px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; flex-shrink: 0; }
  .fl .n.ok { background: #22c55e; }

  .map-list { margin-top: 16px; padding: 12px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
  .map-list .title { color: #f1f5f9; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .map-list .row { display: flex; gap: 10px; }
  .map-list .item { padding: 6px 14px; border-radius: 6px; font-size: 12px; border: 1px solid #334155; color: #94a3b8; }
  .map-list .item.low { border-color: #22c55e44; color: #22c55e; }
  .map-list .item.mid { border-color: #eab30844; color: #eab308; }
  .map-list .item.high { border-color: #ef444444; color: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <h1>🎯 手动选图 — 下拉菜单</h1>
  <p class="sub">新增"地图选择"任务类型，直接在下拉菜单选图</p>

  <div class="lca-win">
    <div class="titlebar">
      <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
      <div class="win-title">LCA 工作流编辑 - 传奇2自动挂机 (v3.1)</div>
    </div>
    <div class="content">
      <!-- Step flow -->
      <div class="card-row">
        <div class="card card-start" style="max-width:180px;"><div class="icon">🏁</div><div class="name">挂机起点</div></div>
      </div>

      <div class="card-row">
        <div class="card card-image" style="max-width:220px;"><div class="icon">🔍</div><div class="name">验证窗口绑定(盟重省)</div></div>
        <div class="arrow">→</div>
        <div class="card card-image" style="max-width:120px;"><div class="icon">➡️</div><div class="name" style="font-size:10px;">走到NPC位置</div></div>
      </div>

      <!-- Selection card (highlighted) -->
      <div class="card-row">
        <div class="card card-select" style="max-width:260px;">
          <div class="icon">👆</div>
          <div class="name">选择挂机地图 <span class="badge">NEW</span></div>
        </div>
      </div>

      <!-- Dropdown menu (simulated) -->
      <div class="dropdown" id="dd">
        <div class="header">🎯 选择要进入的挂机地图</div>
        <div class="item" onclick="selectMap('低级图',this)">
          <span class="emoji">🟢</span> 低级图
          <span class="detail">1~39级</span>
          <span class="check" id="ck1"></span>
        </div>
        <div class="item" onclick="selectMap('中级图',this)">
          <span class="emoji">🟡</span> 中级图
          <span class="detail">40~54级</span>
          <span class="check" id="ck2"></span>
        </div>
        <div class="item" onclick="selectMap('高级图',this)">
          <span class="emoji">🔴</span> 高级图
          <span class="detail">55级以上</span>
          <span class="check" id="ck3"></span>
        </div>
      </div>

      <!-- Path indicator -->
      <div id="pathIndicator" style="margin-top:4px; padding:8px 14px; border-radius:6px; border:1px dashed #334155; display:none; font-size:12px; color:#94a3b8; text-align:center;"></div>
    </div>
  </div>

  <div class="map-list">
    <div class="title">📋 地图列表（点击上方菜单选择）</div>
    <div class="row">
      <div class="item low">🟢 低级图 (1~39级)</div>
      <div class="item mid">🟡 中级图 (40~54级)</div>
      <div class="item high">🔴 高级图 (55级以上)</div>
    </div>
  </div>

  <div class="flow-log" id="flowLog" style="display:none;">
    <div class="fl"><div class="n ok">✓</div><div class="text" id="resultText">已选择：低级图</div></div>
    <div class="fl"><div class="n">→</div><div class="text">target_map 已设定 → 自动跳转到对应路径找NPC进图</div></div>
  </div>
</div>

<script>
function selectMap(name, el) {
  document.querySelectorAll('.dropdown .item').forEach(i => {
    i.classList.remove('selected');
    const ck = i.querySelector('.check');
    if (ck) ck.textContent = '';
  });
  el.classList.add('selected');
  const ck = el.querySelector('.check');
  if (ck) ck.textContent = '✓';

  const emoji = name === '低级图' ? '🟢' : name === '中级图' ? '🟡' : '🔴';
  const level = name === '低级图' ? '1~39级' : name === '中级图' ? '40~54级' : '55级以上';

  const pathEl = document.getElementById('pathIndicator');
  pathEl.style.display = 'block';
  pathEl.innerHTML = `${emoji} <strong style="color:#22c55e;">${name}</strong> (${level}) — 已选择！target_map 已设为 <strong style="color:#facc15;">${name}</strong>`;

  const log = document.getElementById('flowLog');
  log.style.display = 'block';
  document.getElementById('resultText').innerHTML = `✓ 已选择：${emoji} ${name}`;
}
</script>
</body>
</html>
